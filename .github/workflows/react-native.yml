name: React Native client

on:
  push:
    branches: ["main"]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/react-native.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mobile-rn/**"
      - ".github/workflows/react-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, JS bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Android JS bundle
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/android.bundle --assets-dest /tmp/assets-android
      - name: iOS JS bundle
        run: npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output /tmp/ios.bundle --assets-dest /tmp/assets-ios

  android:
    name: Android APK (${{ matrix.abi }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Release APKs will use the debug key (not for distribution)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK for ${{ matrix.abi }}
        working-directory: mobile-rn/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PtargetAbi=${{ matrix.abi }} -PreactNativeArchitectures=${{ matrix.abi }}
      - name: Verify ABI APK
        working-directory: mobile-rn/android
        env:
          ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name "*${ABI}*release*.apk" -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Missing release APK for ABI: $ABI"
            find app/build/outputs/apk -type f -name "*.apk" -print
            exit 1
          fi
          ls -lh "$apk"
      - name: Upload APK for release assembly
        uses: actions/upload-artifact@v4
        with:
          name: aceid-apk-${{ matrix.abi }}
          path: mobile-rn/android/app/build/outputs/apk/release/*${{ matrix.abi }}*release*.apk
          if-no-files-found: error
          retention-days: 2

  publish_android:
    name: Publish individual Android APK assets
    needs: android
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download ABI APKs
        uses: actions/download-artifact@v4
        with:
          pattern: aceid-apk-*
          path: mobile-rn/android-dist
          merge-multiple: true
      - name: Verify all release APKs
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="$(find mobile-rn/android-dist -maxdepth 1 -type f -name "*${abi}*release*.apk" -print -quit)"
            test -n "$apk" || { echo "::error::Missing APK for $abi"; exit 1; }
            ls -lh "$apk"
          done
      - name: Publish individual APK release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android APKs #${{ github.run_number }}
          prerelease: true
          files: mobile-rn/android-dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    needs: check
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      - run: npm ci
      - name: Install pods
        working-directory: mobile-rn/ios
        run: pod install
      - name: Archive (unsigned)
        working-directory: mobile-rn/ios
        run: |
          xcodebuild -workspace AceId.xcworkspace -scheme AceId -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AceId.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package IPA
        run: |
          APP="$(find "$RUNNER_TEMP/AceId.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/mobile-rn/AceId-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: aceid-unsigned-ipa
          path: mobile-rn/AceId-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
